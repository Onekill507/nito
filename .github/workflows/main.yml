                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>
                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                      </ModifyPartition>
                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Letter>C</Letter>
                      </ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                </DiskConfiguration>
                <ImageInstall>
                  <OSImage>
                    <InstallTo><DiskID>0</DiskID><PartitionID>3</PartitionID></InstallTo>
                  </OSImage>
                </ImageInstall>
                <UserData>
                  <AcceptEula>true</AcceptEula>
                  <FullName>AtlasOS User</FullName>
                  <Organization>AtlasOS</Organization>
                  <ProductKey>
                    <!-- Generic KMS key for Windows 11 Pro (activates against KMS, not retail) -->
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                  </ProductKey>
                </UserData>
                <!-- Bypass TPM 2.0 + Secure Boot + RAM checks for QEMU -->
                <RunSynchronous>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassTPMCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassSecureBootCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassRAMCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>4</Order>
                    <Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassCPUCheck /t REG_DWORD /d 1 /f</Path>
                  </RunSynchronousCommand>
                </RunSynchronous>
              </component>
            </settings>

            <settings pass="specialize">
              <component name="Microsoft-Windows-Shell-Setup"
                         processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <ComputerName>AtlasOS-Cloud</ComputerName>
                <TimeZone>UTC</TimeZone>
              </component>
              <component name="Microsoft-Windows-TerminalServices-LocalSessionManager"
                         processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <fDenyTSConnections>false</fDenyTSConnections>
              </component>
              <component name="Networking-MPSSVC-Svc"
                         processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <FirewallGroups>
                  <FirewallGroup wcm:action="add" wcm:keyValue="RemoteDesktop">
                    <Active>true</Active>
                    <Group>Remote Desktop</Group>
                    <Profile>all</Profile>
                  </FirewallGroup>
                </FirewallGroups>
              </component>
            </settings>

            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-Shell-Setup"
                         processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <UserAccounts>
                  <LocalAccounts>
                    <LocalAccount wcm:action="add">
                      <Name>ATLAS_USER_PLACEHOLDER</Name>
                      <Group>Administrators</Group>
                      <Password>
                        <Value>ATLAS_PASS_PLACEHOLDER</Value>
                        <PlainText>true</PlainText>
                      </Password>
                      <DisplayName>AtlasOS Admin</DisplayName>
                      <Description>Remote admin for AtlasOS</Description>
                    </LocalAccount>
                  </LocalAccounts>
                </UserAccounts>
                <AutoLogon>
                  <Username>ATLAS_USER_PLACEHOLDER</Username>
                  <Enabled>true</Enabled>
                  <Password>
                    <Value>ATLAS_PASS_PLACEHOLDER</Value>
                    <PlainText>true</PlainText>
                  </Password>
                  <LogonCount>999</LogonCount>
                </AutoLogon>
                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideLocalAccountScreen>true</HideLocalAccountScreen>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <ProtectYourPC>3</ProtectYourPC>
                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>
                </OOBE>
                <FirstLogonCommands>
                  <!-- Enable RDP -->
                  <SynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <CommandLine>cmd /c reg add "HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f</CommandLine>
                  </SynchronousCommand>
                  <SynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <CommandLine>cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=Yes</CommandLine>
                  </SynchronousCommand>
                  <!-- Download AtlasOS tools -->
                  <SynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <CommandLine>cmd /c mkdir C:\AtlasOS</CommandLine>
                  </SynchronousCommand>
                  <SynchronousCommand wcm:action="add">
                    <Order>4</Order>
                    <CommandLine>powershell -Command "Invoke-WebRequest -Uri 'https://github.com/Atlas-OS/Atlas/releases/latest/download/AtlasPlaybook.exe' -OutFile 'C:\AtlasOS\AtlasPlaybook.exe'"</CommandLine>
                  </SynchronousCommand>
                  <SynchronousCommand wcm:action="add">
                    <Order>5</Order>
                    <CommandLine>powershell -Command "Invoke-WebRequest -Uri 'https://dl.ameliorated.io/AME%%20Wizard.exe' -OutFile 'C:\AtlasOS\AME_Wizard.exe'"</CommandLine>
                  </SynchronousCommand>
                  <!-- Create desktop shortcut -->
                  <SynchronousCommand wcm:action="add">
                    <Order>6</Order>
                    <CommandLine>powershell -Command "$ws = New-Object -ComObject WScript.Shell; $s = $ws.CreateShortcut('C:\Users\Public\Desktop\AtlasOS Setup.lnk'); $s.TargetPath = 'C:\AtlasOS\AtlasPlaybook.exe'; $s.Save()"</CommandLine>
                  </SynchronousCommand>
                </FirstLogonCommands>
              </component>
            </settings>
          </unattend>
          AUTOUNATTEND_EOF

          # Replace placeholders with actual values
          sed -i "s/ATLAS_USER_PLACEHOLDER/$USERNAME/g" /tmp/win11vm/autounattend.xml
          sed -i "s|ATLAS_PASS_PLACEHOLDER|$PASSWORD|g" /tmp/win11vm/autounattend.xml

          echo "✅ autounattend.xml created"
          cat /tmp/win11vm/autounattend.xml | head -20
          echo "..."

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 4 — Create virtio drivers ISO (for better VM performance)
      # ──────────────────────────────────────────────────────────────────────
      - name: "🔧 Prepare VirtIO Drivers"
        run: |
          echo "── Downloading VirtIO drivers ISO ──"
          wget -q --show-progress \
            "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/stable-virtio/virtio-win.iso" \
            -O /tmp/win11vm/virtio.iso 2>&1 || {
            echo "⚠️  VirtIO download failed — VM will use IDE emulation (slower)"
            touch /tmp/win11vm/virtio.iso
          }
          ls -lh /tmp/win11vm/virtio.iso

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 5 — Launch QEMU Windows 11 VM
      #
      #  Changes from the original broken config:
      #    1. pflash (OVMF_CODE + OVMF_VARS) replaces -bios
      #       → -bios loads OVMF as ROM; NVRAM volatile; boot entries lost on reboot
      #    2. Removed if=virtio from system disk
      #       → virtio.iso downloaded in Step 4 but NEVER attached as -drive
      #       → Windows 11 has no built-in viostor driver
      #       → autounattend.xml has no <DriverPaths> element
      #       → Result: disk invisible to Setup, nothing installed, reboot→Shell
      #    3. Added format=raw to CD-ROM drive
      #       → Prevents QEMU format probing on the ISO file
      #    4. Added -boot order=d
      #       → Ensures first boot from DVD; NVRAM takes over after install
      #    5. tpm-crb replaces tpm-tis
      #       → Microsoft-recommended TPM interface for Windows 11
      # ──────────────────────────────────────────────────────────────────────
      - name: "🖥️ Boot Windows 11 VM"
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  🚀 Launching Windows 11 VM via QEMU"
          echo "═══════════════════════════════════════════════════"

          # ── Create autounattend floppy image ──
          sudo apt-get install -y -qq mtools dosfstools
          dd if=/dev/zero of=/tmp/win11vm/autounattend.img bs=1M count=2
          mkfs.vfat /tmp/win11vm/autounattend.img
          mcopy -i /tmp/win11vm/autounattend.img /tmp/win11vm/autounattend.xml ::

          # ── Determine acceleration ──
          ACCEL="tcg"
          if [ -e /dev/kvm ]; then
            ACCEL="kvm"
            echo "  Using KVM acceleration"
          else
            echo "  Using TCG (software emulation — SLOW)"
            echo "  ⚠️  Windows 11 installation may take 30-60+ minutes without KVM"
          fi

          # ── Locate OVMF firmware files (paths vary by Ubuntu version) ──
          OVMF_CODE=""
          OVMF_VARS=""

          # Try standard Ubuntu ovmf package paths (uppercase /usr/share/OVMF/)
          for code_candidate in \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/edk2/ovmf/OVMF_CODE.fd \
            /usr/share/qemu/OVMF.fd \
          ; do
            if [ -f "$code_candidate" ]; then
              OVMF_CODE="$code_candidate"
              break
            fi
          done

          for vars_candidate in \
            /usr/share/OVMF/OVMF_VARS.fd \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/edk2/ovmf/OVMF_VARS.fd \
          ; do
            if [ -f "$vars_candidate" ]; then
              OVMF_VARS="$vars_candidate"
              break
            fi
          done

          # If split files not found, try extracting from the combined blob
          if [ -z "$OVMF_CODE" ] && [ -f /usr/share/ovmf/OVMF.fd ]; then
            echo "  Split OVMF not found; using combined blob as CODE..."
            OVMF_CODE="/usr/share/ovmf/OVMF.fd"
            # Generate a blank VARS file (256 KB is standard for OVMF)
            dd if=/dev/zero of=/tmp/win11vm/OVMF_VARS.fd bs=1K count=256 2>/dev/null
            echo "  Generated blank NVRAM (256 KB)"
          fi

          if [ -z "$OVMF_CODE" ]; then
            echo "❌ FATAL: Cannot find any OVMF firmware files!"
            echo "   Searched: /usr/share/OVMF/, /usr/share/edk2/ovmf/, /usr/share/qemu/"
            echo "   Listing available firmware files:"
            find /usr/share -iname "*OVMF*" -o -iname "*ovmf*" 2>/dev/null | head -20
            exit 1
          fi

          # Create a WRITABLE copy of OVMF_VARS.fd (never modify the system template)
          if [ -n "$OVMF_VARS" ] && [ ! -f /tmp/win11vm/OVMF_VARS.fd ]; then
            cp "$OVMF_VARS" /tmp/win11vm/OVMF_VARS.fd
            echo "  ✅ NVRAM initialized from $OVMF_VARS"
          fi

          echo "  OVMF CODE: $OVMF_CODE"
          echo "  OVMF VARS: /tmp/win11vm/OVMF_VARS.fd"
          ls -la "$OVMF_CODE" /tmp/win11vm/OVMF_VARS.fd

          # ──────────────────────────────────────────────────────────────────
          #  Build QEMU command
          # ──────────────────────────────────────────────────────────────────

          QEMU_CMD=(
            qemu-system-x86_64
            -m 4096
            -smp 2
            -cpu qemu64,+sse4.2,+popcnt
            -machine q35,accel=${ACCEL}

            # FIX #1: UEFI via pflash (persistent NVRAM)
            -drive if=pflash,format=raw,readonly=on,file=${OVMF_CODE}
            -drive if=pflash,format=raw,file=/tmp/win11vm/OVMF_VARS.fd

            # FIX #4: TPM 2.0 (tpm-crb for Win11)
            -chardev socket,id=chrtpm,path=/tmp/win11vm/swtpm-sock
            -tpmdev emulator,id=tpm0,chardev=chrtpm
            -device tpm-crb,tpmdev=tpm0

            # FIX #2: Default interface = AHCI/SATA on q35 (not VirtIO)
            # Added format=raw to CD-ROM to prevent QEMU format probing
            -drive file=/tmp/win11vm/disk.qcow2,format=qcow2
            -drive file=/tmp/win11vm/win11.iso,media=cdrom,format=raw
            -drive file=/tmp/win11vm/autounattend.img,format=raw,if=floppy

            # FIX #3: DVD boots first; NVRAM takes over after install
            -boot order=d

            # Network (user-mode with port forwarding)
            -netdev user,id=net0,hostfwd=tcp::3389-:3389,hostfwd=tcp::8080-:8080
            -device virtio-net-pci,netdev=net0

            # VNC display (noVNC will serve this in the browser on port 6080)
            -vnc :0
            -vga std

            # Misc
            -name "Win11-AtlasOS"
            -daemonize
          )

          # ── Start software TPM ──
          mkdir -p /tmp/win11vm/tpmstate
          swtpm socket \
            --tpmstate dir=/tmp/win11vm/tpmstate \
            --ctrl type=unixio,path=/tmp/win11vm/swtpm-sock \
            --tpm2 \
            --log level=0 &
          sleep 2

          # ── Launch VM ──
          echo "  Starting QEMU..."
          echo "  Command: ${QEMU_CMD[*]}"
          "${QEMU_CMD[@]}" 2>&1 || {
            echo "⚠️  Primary QEMU launch failed. Retrying with simplified config..."

            # Fallback: minimal config, same critical fixes
            qemu-system-x86_64 \
              -m 4096 -smp 2 \
              -cpu qemu64,+sse4.2,+popcnt \
              -machine q35,accel=${ACCEL} \
              -drive if=pflash,format=raw,readonly=on,file=${OVMF_CODE} \
              -drive if=pflash,format=raw,file=/tmp/win11vm/OVMF_VARS.fd \
              -drive file=/tmp/win11vm/disk.qcow2,format=qcow2 \
              -drive file=/tmp/win11vm/win11.iso,media=cdrom,format=raw \
              -drive file=/tmp/win11vm/autounattend.img,format=raw,if=floppy \
              -boot order=d \
              -netdev user,id=net0,hostfwd=tcp::3389-:3389 \
              -device e1000,netdev=net0 \
              -vnc :0 \
              -daemonize
          }

          echo "✅ QEMU VM launched"
          echo "  Waiting for Windows to install (this takes time without KVM)..."
          
          # Verify VNC is listening
          sleep 3
          if nc -z localhost 5900 2>/dev/null; then
            echo "✅ VNC server listening on port 5900"
          else
            echo "⚠️  VNC not yet listening on 5900 (may take a moment)"
          fi

          # Verify NVRAM file is being written (confirms pflash persistence)
          if [ -f /tmp/win11vm/OVMF_VARS.fd ]; then
            VARS_SIZE=$(stat -c%s /tmp/win11vm/OVMF_VARS.fd 2>/dev/null)
            echo "  NVRAM file size: ${VARS_SIZE} bytes (should be 256KB or 512KB)"
          fi

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 6 — Wait for RDP to become available
      # ──────────────────────────────────────────────────────────────────────
      - name: "⏳ Wait for Windows RDP (up to 90 minutes)"
        run: |
          echo "── Polling for RDP on localhost:3389 ──"
          echo "  (Windows installation + OOBE can take a while, especially in TCG mode)"

          MAX_WAIT=5400   # 90 minutes
          ELAPSED=0
          INTERVAL=30

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            if nc -z localhost 3389 2>/dev/null; then
              echo ""
              echo "✅ RDP is available on localhost:3389!"
              break
            fi
            MINS=$((ELAPSED / 60))
            SECS=$((ELAPSED % 60))
            printf "\r  Waiting... %dm %ds elapsed" $MINS $SECS
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          if ! nc -z localhost 3389 2>/dev/null; then
            echo ""
            echo "⚠️  RDP not available after 90 minutes."
            echo "  The VM may still be installing. Continuing anyway..."
          fi

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 7 — Start tunnels and print connection info
      # ──────────────────────────────────────────────────────────────────────
      - name: "🌐 Start noVNC Web Desktop + Tunnels & Display Connection Info"
        run: |
          USERNAME="${{ github.event.inputs.rdp_user }}"
          PASSWORD="${{ github.event.inputs.rdp_password }}"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  🔑 CONNECTION INFORMATION"
          echo "════════════════════════════════════════════════════════════"

          # ── Start bore tunnel for RDP (native client fallback) ──
          echo "── Starting bore TCP tunnel (RDP fallback) ──"
          bore local 3389 --to bore.pub > /tmp/bore_rdp.log 2>&1 &
          BORE_PID=$!
          sleep 8

          # Parse bore output
          BORE_OUTPUT=$(cat /tmp/bore_rdp.log 2>/dev/null)
          echo "  Bore: $BORE_OUTPUT"
          RDP_ADDR="UNKNOWN"
          if echo "$BORE_OUTPUT" | grep -oP 'bore\.pub:\K\d+' > /tmp/bore_port; then
            BORE_PORT=$(cat /tmp/bore_port)
            RDP_ADDR="bore.pub:${BORE_PORT}"
          elif echo "$BORE_OUTPUT" | grep -oP '\d+\.\d+\.\d+\.\d+:\d+' > /tmp/bore_addr; then
            RDP_ADDR=$(cat /tmp/bore_addr)
          fi

          # ── Start noVNC (web-based VNC client — Windows desktop in browser!) ──
          echo "── Starting noVNC web desktop (port 6080 → VNC 5900) ──"

          # Verify VNC is listening first
          if nc -z localhost 5900 2>/dev/null; then
            echo "  ✅ VNC server confirmed on port 5900"
          else
            echo "  ⚠️  VNC not yet on 5900, starting noVNC anyway..."
          fi

          # Launch noVNC via websockify
          # --vnc localhost:5900  : connect to QEMU's VNC server
          # --listen 6080         : serve web client on port 6080
          # --web /tmp/novnc      : serve noVNC's HTML/JS files
          /tmp/novnc/utils/novnc_proxy \
            --vnc localhost:5900 \
            --listen 6080 \
            --web /tmp/novnc \
            > /tmp/novnc.log 2>&1 &
          NOVNC_PID=$!
          sleep 3

          # Verify noVNC is running
          if nc -z localhost 6080 2>/dev/null; then
            echo "  ✅ noVNC web server running on port 6080"
          else
            echo "  ⚠️  noVNC may not be ready yet (check /tmp/novnc.log)"
            cat /tmp/novnc.log 2>/dev/null | tail -5
          fi

          # ── Start cloudflared tunnel pointing to noVNC ──
          echo "── Starting cloudflared tunnel → noVNC (port 6080) ──"
          cloudflared tunnel --url http://localhost:6080 > /tmp/cf_tunnel.log 2>&1 &
          CF_PID=$!
          sleep 10

          # Extract the public URL
          HTTP_URL="N/A"
          if grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf_tunnel.log 2>/dev/null > /tmp/cf_url; then
            HTTP_URL=$(cat /tmp/cf_url)
            # Build the direct-to-desktop URL (auto-connects to VNC)
            WEB_DESKTOP_URL="${HTTP_URL}/vnc.html?autoconnect=true&resize=scale&reconnect=true&reconnect_delay=3000"
            WEB_LANDING_URL="${HTTP_URL}/"
          else
            WEB_DESKTOP_URL="N/A"
            WEB_LANDING_URL="N/A"
            echo "  ⚠️  Could not extract cloudflared URL"
            cat /tmp/cf_tunnel.log 2>/dev/null | tail -10
          fi

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║        🖥️  WINDOWS 11 WEB DESKTOP — OPEN IN BROWSER       ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🌐 Web Desktop (open this in your browser!):                ║"
          echo "║                                                              ║"
          echo "║  $WEB_DESKTOP_URL"
          echo "║                                                              ║"
          echo "║  Landing page:                                               ║"
          echo "║  $WEB_LANDING_URL"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  🖧 RDP Fallback (native client):                            ║"
          echo "║    Address:  $RDP_ADDR"
          echo "║    Username: $USERNAME"
          echo "║    Password: $PASSWORD"
          echo "║                                                              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  📋 Web Desktop Tips:                                        ║"
          echo "║    • The link above opens Windows 11 directly in browser     ║"
          echo "║    • Use Ctrl+Alt+Del via the noVNC sidebar (left edge)      ║"
          echo "║    • Press F11 for fullscreen for best experience            ║"
          echo "║    • AtlasOS tools are at C:\\AtlasOS\\ on the VM desktop    ║"
          echo "║    • If screen is black, Windows is still installing         ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

          # Save URLs to a file for reference
          cat > /tmp/connection_info.txt << EOF
          ══════════════════════════════════════════
            CONNECTION DETAILS
          ══════════════════════════════════════════
          Web Desktop : $WEB_DESKTOP_URL
          Landing     : $WEB_LANDING_URL
          RDP Address : $RDP_ADDR
          Username    : $USERNAME
          Password    : $PASSWORD
          ══════════════════════════════════════════
          EOF

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 8 — Keep-alive loop
      # ──────────────────────────────────────────────────────────────────────
      - name: "⏱️ Keep-Alive (${{ github.event.inputs.duration_hours }}h)"
        run: |
          DURATION_HOURS="${{ github.event.inputs.duration_hours }}"
          TOTAL_SECONDS=$((DURATION_HOURS * 3600))
          ELAPSED=0
          INTERVAL=60

          echo "═══════════════════════════════════════════════════"
          echo "  ⏱️  Keep-Alive: ${DURATION_HOURS}h (${TOTAL_SECONDS}s)"
          echo "  Monitoring: QEMU VM + noVNC + bore + cloudflared"
          echo "═══════════════════════════════════════════════════"

          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            HOURS_LEFT=$((REMAINING / 3600))
            MINS_LEFT=$(( (REMAINING % 3600) / 60 ))

            # Check all services
            VM_STATUS="✓"
            pgrep -x qemu-system-x86 > /dev/null 2>&1 || VM_STATUS="✗"

            VNC_STATUS="✓"
            nc -z localhost 5900 2>/dev/null || VNC_STATUS="✗"

            NOVNC_STATUS="✓"
            nc -z localhost 6080 2>/dev/null || NOVNC_STATUS="✗"

            BORE_STATUS="✓"
            pgrep -f "bore local" > /dev/null 2>&1 || BORE_STATUS="✗"

            CF_STATUS="✓"
            pgrep -f cloudflared > /dev/null 2>&1 || CF_STATUS="✗"

            TIMESTAMP=$(date +%H:%M:%S)
            echo "[$TIMESTAMP] ⏳ ${HOURS_LEFT}h${MINS_LEFT}m left | VM:$VM_STATUS VNC:$VNC_STATUS noVNC:$NOVNC_STATUS bore:$BORE_STATUS cf:$CF_STATUS"

            # Restart noVNC if dead
            if ! nc -z localhost 6080 2>/dev/null; then
              echo "  ⚠️ noVNC died — restarting..."
              /tmp/novnc/utils/novnc_proxy \
                --vnc localhost:5900 \
                --listen 6080 \
                --web /tmp/novnc \
                > /tmp/novnc.log 2>&1 &
            fi

            # Restart bore if dead
            if ! pgrep -f "bore local" > /dev/null 2>&1; then
              echo "  ⚠️ bore died — restarting (new address!)"
              bore local 3389 --to bore.pub > /tmp/bore_rdp.log 2>&1 &
            fi

            # Restart cloudflared if dead
            if ! pgrep -f cloudflared > /dev/null 2>&1; then
              echo "  ⚠️ cloudflared died — restarting (new URL!)"
              cloudflared tunnel --url http://localhost:6080 > /tmp/cf_tunnel.log 2>&1 &
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo ""
          echo "🏁 Session complete. VM will be destroyed."

      # ──────────────────────────────────────────────────────────────────────
      #  STEP 9 — Cleanup
      # ──────────────────────────────────────────────────────────────────────
      - name: "🧹 Cleanup"
        if: always()
        run: |
          echo "── Shutting down all services ──"
          pkill -f qemu-system-x86 || true
          pkill -f swtpm || true
          pkill -f bore || true
          pkill -f cloudflared || true
          pkill -f novnc_proxy || true
          pkill -f websockify || true
          pkill -f "python3.*launch" || true
          rm -rf /tmp/win11vm /tmp/novnc /tmp/bore
          echo "✅ Cleanup complete"
